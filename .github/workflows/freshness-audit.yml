name: Monthly Path Freshness & Link Audit

on:
  schedule:
    # 每月 1 号 UTC 02:00（北京时间 10:00）自动执行
    - cron: '0 2 1 * *'
  workflow_dispatch: # 允许在 GitHub Actions 页面手动触发测试

permissions:
  contents: write
  issues: write

jobs:
  freshness-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run freshness & dead-link audit
        id: audit
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/check-freshness.ts | tee audit-report.txt

      - name: Commit updated link health snapshot
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if ! git diff --quiet src/data/linkHealthReport.json; then
            git add src/data/linkHealthReport.json
            git commit -m "chore(audit): 自动更新路径官网链路健康快照 [skip ci]"
            git push
          else
            echo "No link health changes to commit."
          fi

      - name: Create GitHub Issue if alerts found
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('audit-report.txt')) return;
            const rawReport = fs.readFileSync('audit-report.txt', 'utf8');
            if (rawReport.includes('🚨')) {
              const date = new Date().toISOString().split('T')[0];
              const report = rawReport.length > 58000
                ? rawReport.slice(0, 58000) + '\n...(已截断，完整日志请查看本次 Action 运行记录)'
                : rawReport;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[时效巡检告警] ${date} 发现待核验路径或异常官网链接`,
                body: `### 自动巡检报告\n\n\`\`\`text\n${report}\n\`\`\`\n\n请人工核对上述路径的最新官方简章与链接状态，核验完成后更新 \`src/data/verifiedPaths.ts\` 中对应路径的 \`last_verified_date\`（以及必要时的 \`status_light\` / \`src/data/freshnessRegistry.ts\`），并运行 \`npm run audit:paths\` 验证通过。`,
                labels: ['freshness-audit']
              });
            }
